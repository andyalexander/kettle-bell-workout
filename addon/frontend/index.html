<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- The .ico is for whatever can't use the SVG: iOS Home Screen bookmarks
         and anything that asks for /favicon.ico by name. sizes="32x32" keeps
         browsers that can use the SVG choosing it. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Added to the Home Screen, it opens full screen with no browser controls.
         The status bar goes translucent over the dim ground; the safe-area
         padding in Page and WorkoutScreen keeps content clear of it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#101014" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Kettlebell" />
    <title>Kettlebell</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
