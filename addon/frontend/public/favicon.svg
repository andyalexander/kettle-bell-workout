<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>
  <!-- Interval ring: three quarters of the minute gone. -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#333" stroke-width="7"/>
  <path d="M64 14 A50 50 0 1 1 14 64" fill="none" stroke="#fafafa"
        stroke-width="7" stroke-linecap="round"/>
  <!-- Handle first, so the body hides where its legs meet the shoulders. -->
  <path fill-rule="evenodd" fill="url(#bell)"
        d="M41 70 L43 44 Q44 32 56 32 H72 Q84 32 85 44 L87 70 Z
           M52 62 L53 47 Q53.5 41 59 41 H69 Q74.5 41 75 47 L76 62 Z"/>
  <!-- Body: a circle with the base sliced flat so it stands. -->
  <path d="M50.7 96 A24 24 0 1 1 77.3 96 Z" fill="url(#bell)"/>
  <path d="M46 74 A18 18 0 0 1 55 60" fill="none" stroke="#fff"
        stroke-opacity="0.4" stroke-width="3" stroke-linecap="round"/>
</svg>
