    <path d="M50.7 96 A24 24 0 1 1 77.3 96 Z" fill="url(#bell)"/>
    <path d="M46 74 A18 18 0 0 1 55 60" fill="none" stroke="#fff"
          stroke-opacity="0.4" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="102" y="54" font-family="Avenir Next, Helvetica Neue, sans-serif"
        font-size="28" font-weight="700" fill="#fafafa">Kettlebell</text>
  <text x="103" y="74" font-family="Avenir Next, Helvetica Neue, sans-serif"
        font-size="13" font-weight="600" letter-spacing="4"
        fill="#fb923c">TRAINER</text>
