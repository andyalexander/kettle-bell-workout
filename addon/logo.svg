<svg xmlns="http://www.w3.org/2000/svg" width="250" height="100" viewBox="0 0 250 100">
  <defs>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="250" height="100" rx="20" fill="url(#tile)"/>
  <!-- The icon's ring and bell, drawn in its 128-unit space and scaled down. -->
  <g transform="translate(2 2) scale(0.75)">
    <circle cx="64" cy="64" r="50" fill="none" stroke="#333" stroke-width="7"/>
    <path d="M64 14 A50 50 0 1 1 14 64" fill="none" stroke="#fafafa"
