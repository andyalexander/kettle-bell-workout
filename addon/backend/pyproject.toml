[project]
name = "kettlebell"
# Required by the build backend, and never read. The app's version is the one in
# addon/config.yaml — see `Settings.version`.
version = "0.0.0"
description = "EMOM and interval kettlebell workouts, served as a Home Assistant app."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.11",
    "fastapi>=0.121",
    "paho-mqtt>=2.1,<3",
    "pillow>=12.3.0",
    "uvicorn[standard]>=0.38",
]

[dependency-groups]
dev = [
    "anyio>=4.11",
    "httpx>=0.28",
    "pyright>=1.1.406",
    "pytest>=8.4",
    "pyyaml>=6.0.3",
    "ruff>=0.14",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.9,<0.15"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kettlebell"
module-root = "src"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
# FastAPI registers route handlers by decorator, so they read as unused.
reportUnusedFunction = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
