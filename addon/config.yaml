name: Kettlebell Trainer
# The app's one version. Supervisor builds the image with it, and the image hands
# it to the app as KB_VERSION — so a release bumps this line and nothing else.
version: "0.5.1"
slug: kettlebell
description: >-
  EMOM and interval kettlebell workouts, with results published to
  Home Assistant over MQTT.
url: https://github.com/andyalexander/kettle-bell-workout
arch:
  - aarch64
  - amd64

# Required: the base images run S6-Overlay v3, which owns PID 1.
init: false
# Start before Core, which consumes the MQTT discovery messages we publish.
startup: services
boot: auto

# Mounts the shared /ssl folder read-only. This does NOT turn TLS on — that is
# the `ssl` option below, which run.sh reads. It must be a `map` entry: a
# top-level `ssl: true` is not in Supervisor's schema, which silently drops
# unknown keys (`extra=vol.REMOVE_EXTRA`), so /ssl was never mounted.
map:
  - ssl

ports:
  8234/tcp: 8234
ports_description:
  8234/tcp: Web interface

# [PROTO:ssl] resolves to https or http from the boolean option named `ssl` —
# the name is load-bearing, see supervisor/apps/app.py `watchdog_application`.
webui: "[PROTO:ssl]://[HOST]:[PORT:8234]/"
watchdog: "[PROTO:ssl]://[HOST]:[PORT:8234]/api/health"

# Broker host, port and credentials come from the Supervisor, never from options.
services:
  - mqtt:need

# Stop the app before the backup tar is written, so SQLite is quiescent.
backup: cold

options:
  log_level: info
  mqtt_discovery_prefix: homeassistant
  # Off by default: HTTP is the zero-config route. Turning this on buys the
  # Screen Wake Lock API, which is [SecureContext] — see DOCS.md.
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: "list(debug|info|warning|error)"
  mqtt_discovery_prefix: str
  ssl: bool
  # Filenames, not paths: both are resolved against the /ssl mount.
  certfile: str
  keyfile: str

# Adding an `image:` key here switches Supervisor from building on the Pi to
# pulling from a registry. Left absent deliberately — see
# docs/research/addon-packaging.md §3.
