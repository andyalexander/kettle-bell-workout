# Ruff only: the front end has no formatter yet, and prettier's pre-commit mirror
# is deprecated upstream. Install with `pre-commit install`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^addon/backend/
      - id: ruff-format
        files: ^addon/backend/
